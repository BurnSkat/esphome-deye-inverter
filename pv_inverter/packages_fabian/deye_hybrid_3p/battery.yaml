sensor:
  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}_300s
    name: "${device_type}-Daily Battery Charge"
    id: daily_battery_charge
    register_type: holding
    address: 514
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}_300s
    name: "${device_type}-Daily Battery Discharge"
    id: daily_battery_discharge
    register_type: holding
    address: 515
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}_300s
    name: "${device_type}-Total charge of the battery"
    id: total_battery_charge
    register_type: holding
    address: 516
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_DWORD_R
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}_300s
    name: "${device_type}-Total discharge of the battery"
    id: total_battery_discharge
    register_type: holding
    address: 518
    unit_of_measurement: "kWh"
    device_class: energy
    state_class: "total_increasing"
    accuracy_decimals: 1
    value_type: U_DWORD_R
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}_300s
    name: "${device_type}-battery temperature"
    id: battery_temperature
    register_type: holding
    address: 586
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: "measurement"
    accuracy_decimals: 1
    value_type: U_WORD
    filters:
      - offset: -1000
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "${device_type}-battery voltage"
    id: battery_voltage
    register_type: holding
    address: 587
    unit_of_measurement: "V"
    device_class: voltage
    state_class: "measurement"
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    value_type: U_WORD

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Battery BMS Charging Voltage"
    id: battery_bms_charging_voltage
    register_type: holding
    address: 210
    unit_of_measurement: "V"
    device_class: voltage
    accuracy_decimals: 2
    filters:
      - multiply: 0.01
    value_type: U_WORD
    icon: "mdi:flash-triangle"

  - platform: modbus_controller
    modbus_controller_id: ${modbus_controller_id}
    name: "Battery BMS Discharging Voltage"
